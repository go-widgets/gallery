<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>go-widgets — isometric diagram editor (wasm)</title>
<meta name="description" content="Interactive, collaborative isometric diagram editor — a live wasm demo of the go-widgets/toolkit IsoDiagram widget and its CRDT store.">
<style>
  /* Full-page app by default: html/body/#screen fill the whole viewport with no
     margin, and the canvas' intrinsic size tracks the window (the webcanvas
     harness relayouts and re-renders on every resize), so the two Site A / B
     panels stretch to fill the window instead of sitting in a fixed 1120×700 box. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b0d12; color: #e6e8f0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  /* The canvas lives inside a fixed full-viewport stage so the loading
     placeholder can overlay it exactly and be swapped out once the wasm paints. */
  .stage { position: fixed; inset: 0; }
  #screen { display: block; width: 100%; height: 100%; background: #ffffff;
    cursor: crosshair; opacity: 0; transition: opacity .25s; }
  .stage.ready #screen { opacity: 1; }
  /* Loading placeholder: full-screen skeleton + a real progress bar driven by the
     streamed wasm download; hidden once the app signals it is ready. */
  #pg-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; background: #0b0d12; }
  .stage.ready #pg-placeholder { display: none; }
  .pg-skel { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: min(1000px,74vw); height: min(560px,56vh); }
  .pg-skel > div { border: 1px solid #262c40; border-radius: 12px; background: linear-gradient(100deg,#12151f 30%,#1a2030 50%,#12151f 70%); background-size: 200% 100%; animation: pgshimmer 1.4s linear infinite; }
  @keyframes pgshimmer { to { background-position: -200% 0; } }
  .pg-load { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #9aa0b4; font-size: 13px; }
  .pg-track { width: min(440px,60vw); height: 8px; border-radius: 6px; background: #1a2030; overflow: hidden; }
  .pg-fill { height: 100%; width: 0; background: #14b8a6; transition: width .15s ease; }
  #pg-pct { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  /* A small, unobtrusive floating link back to the widget gallery, above the
     canvas but out of the way. */
  #home { position: fixed; top: 10px; right: 12px; z-index: 20; font-size: .82rem;
    padding: 5px 10px; border-radius: 8px; background: rgba(11,13,18,.72); color: #14b8a6;
    text-decoration: none; border: 1px solid #262c40; backdrop-filter: blur(4px); }
  #home:hover { background: rgba(20,184,166,.16); }
  #err { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30;
    display: none; color: #ff5f57; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .85rem; white-space: pre-wrap; max-width: 92vw; text-align: center;
    background: rgba(11,13,18,.85); border: 1px solid #3a2030; border-radius: 8px; padding: 10px 14px; }
  #err.show { display: block; }
</style>
</head>
<body>
  <a id="home" href="./index.html">← widget gallery</a>
  <div class="stage">
    <canvas id="screen" width="1120" height="700"></canvas>
    <div id="pg-placeholder">
      <div class="pg-skel"><div></div><div></div></div>
      <div class="pg-load">
        <div id="pg-msg">Downloading the WebAssembly editor…</div>
        <div class="pg-track"><div class="pg-fill" id="pg-fill"></div></div>
        <div id="pg-pct">0%</div>
      </div>
    </div>
  </div>
  <div id="err"></div>
  <script>
    // Defensive Go-wasm fs guard (see index.html for the full rationale): fill in
    // globalThis.fs only when it is absent or incomplete, so the demo boots in
    // any environment instead of panicking and blanking the canvas. NEVER use an
    // element id of "fs" on this page — it would shadow this global.
    (() => {
      const g = globalThis;
      if (!g.fs || typeof g.fs.writeSync !== "function") {
        let buf = ""; const dec = new TextDecoder("utf-8");
        g.fs = {
          constants: { O_WRONLY: -1, O_RDWR: -1, O_CREAT: -1, O_TRUNC: -1, O_APPEND: -1, O_EXCL: -1, O_DIRECTORY: -1 },
          writeSync(fd, b) {
            buf += dec.decode(b);
            const nl = buf.lastIndexOf("\n");
            if (nl !== -1) { console.log(buf.substring(0, nl)); buf = buf.substring(nl + 1); }
            return b.length;
          },
          write(fd, b, off, len, pos, cb) { const n = this.writeSync(fd, b.subarray(off, off + len)); cb(null, n); },
        };
      }
    })();
  </script>
  <script src="wasm_exec.js"></script>
  <script>
    "use strict";
    (() => {
      const $ = (id) => document.getElementById(id);
      const stage = document.querySelector(".stage");
      const errBox = $("err");
      // The DECOMPRESSED wasm size, stamped at deploy time by pages.yml (which
      // rewrites the __WASM_BYTES__ token with `stat -c%s iso.wasm`). Pages serves the
      // wasm gzip-compressed, but the stream reader below yields DECOMPRESSED bytes and
      // Content-Length is the COMPRESSED length — so we drive the bar against this
      // real total, or it would shoot past 100%. Falls back to Content-Length when
      // the token was not substituted (a plain local open).
      const wasmBytes = parseInt("__WASM_BYTES__", 10) || 0;

      // setProgress drives the placeholder bar. frac in [0,1]; null = indeterminate.
      function setProgress(frac) {
        const fill = $("pg-fill"), pct = $("pg-pct");
        if (!fill) return;
        if (frac == null) { fill.style.width = "100%"; fill.style.opacity = "0.45"; pct.textContent = "…"; return; }
        const p = Math.max(0, Math.min(100, Math.round(frac * 100)));
        fill.style.opacity = "1"; fill.style.width = p + "%"; pct.textContent = p + "%";
      }

      const go = new Go();
      function boot(result) {
        setProgress(1);
        $("pg-msg").textContent = "Starting the editor…";
        go.run(result.instance);
        // webcanvas.Run paints the first frame synchronously during go.run, fits the
        // canvas to the viewport (the scene is a Resizer) and sets
        // globalThis.webcanvasReady; poll for it, then reveal the canvas.
        const t = setInterval(() => {
          if (globalThis.webcanvasReady) { clearInterval(t); stage.classList.add("ready"); }
        }, 30);
      }
      function fail(e) {
        $("pg-msg").textContent = "The editor failed to load.";
        const hint = location.protocol === "file:"
          ? "\n(open this page over http:// — file:// blocks fetching the wasm.)"
          : "\n(try a hard refresh — the wasm asset may be cached stale.)";
        errBox.textContent = "Failed to load iso.wasm: " + String(e && e.message ? e.message : e) + hint;
        errBox.classList.add("show");
      }

      // streamFetch downloads the wasm through a ReadableStream reader, updating the
      // progress bar from the received / decompressed-total ratio, then verifies the
      // wasm magic number and instantiates. It replaces instantiateStreaming so the
      // multi-megabyte download shows real progress instead of a blank gap.
      function streamFetch(url) {
        return fetch(url, { cache: "reload" }).then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status + " fetching " + url);
          const total = wasmBytes || parseInt(r.headers.get("Content-Length") || "0", 10) || 0;
          if (!r.body || !r.body.getReader) { return r.arrayBuffer(); } // no streaming: one shot
          const reader = r.body.getReader(); let received = 0; const chunks = [];
          return (function pump() {
            return reader.read().then((res) => {
              if (res.done) {
                const buf = new Uint8Array(received); let pos = 0;
                for (const c of chunks) { buf.set(c, pos); pos += c.length; }
                return buf.buffer;
              }
              chunks.push(res.value); received += res.value.length;
              setProgress(total ? received / total : null);
              return pump();
            });
          })();
        }).then((ab) => {
          const m = new Uint8Array(ab, 0, 4);
          if (!(m[0] === 0x00 && m[1] === 0x61 && m[2] === 0x73 && m[3] === 0x6d))
            throw new Error("the URL did not return a WebAssembly module");
          return WebAssembly.instantiate(ab, go.importObject);
        });
      }

      streamFetch("iso.wasm").then(boot).catch(fail);
    })();
  </script>
</body>
</html>
